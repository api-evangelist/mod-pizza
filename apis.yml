aid: mod-pizza
name: MOD Pizza
description: >-
  MOD Pizza is a Seattle-based fast-casual restaurant chain built around individually sized,
  made-to-order artisan-style pizzas and salads sold at one fixed price regardless of how many
  of its 40-plus toppings, finishing sauces and dressings a guest chooses. The company operates
  and franchises hundreds of locations across the United States and runs a digital guest surface
  consisting of a WordPress marketing site, a Yext-powered store locator, a Koala-powered online
  ordering storefront at orders.modpizza.com, and a Punchh-powered MOD Rewards loyalty app on iOS
  and Android. MOD Pizza is a consumer of restaurant-technology APIs rather than a publisher of
  them: as of this profiling pass it operates no developer program, publishes no OpenAPI, AsyncAPI,
  GraphQL or MCP contract, and exposes no partner or franchisee API documentation on any host it
  controls. Delivery is fulfilled through third-party marketplaces such as DoorDash rather than a
  first-party delivery API.
